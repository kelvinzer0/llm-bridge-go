name: Test & Release Linux

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Unit Tests & Race Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run Unit Tests
        run: |
          go test -v -race -coverprofile=coverage.txt ./...

  test-installer:
    name: Test Linux Installation & Service Lifecycle
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Local Linux Binary
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w" -o bin/llm-bridge ./cmd/llm-bridge

      - name: Execute Linux Installer
        run: |
          sudo ./scripts/install.sh

      - name: Verify Binary and Configuration
        run: |
          test -x /usr/local/bin/llm-bridge
          test -f /etc/llm-bridge/llm-bridge.env
          /usr/local/bin/llm-bridge -h

      - name: Verify Service Status and Health Endpoint
        run: |
          sleep 2
          sudo service llm-bridge status || sudo systemctl status llm-bridge.service
          curl -f -s http://127.0.0.1:8080/health

      - name: Verify Service Restart Cycle
        run: |
          sudo service llm-bridge restart || sudo systemctl restart llm-bridge.service
          sleep 2
          sudo service llm-bridge status || sudo systemctl status llm-bridge.service
          curl -f -s http://127.0.0.1:8080/health

      - name: Test Uninstallation
        run: |
          sudo ./scripts/uninstall.sh
          if [ -f /usr/local/bin/llm-bridge ]; then
            echo "Error: Binary was not removed after uninstallation" >&2
            exit 1
          fi
          echo "Uninstallation verified successfully."

  build-linux:
    name: Build Linux ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [test, test-installer]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
          - goarch: arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Linux Binary and Package
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          PKG_NAME="llm-bridge-linux-${{ matrix.goarch }}"
          mkdir -p "dist/${PKG_NAME}/bin"
          mkdir -p "dist/${PKG_NAME}/scripts"

          go build -trimpath -ldflags="-s -w" -o "dist/${PKG_NAME}/bin/llm-bridge" ./cmd/llm-bridge
          cp scripts/install.sh "dist/${PKG_NAME}/"
          cp scripts/uninstall.sh "dist/${PKG_NAME}/"
          cp scripts/llm-bridge.service "dist/${PKG_NAME}/scripts/"
          chmod +x "dist/${PKG_NAME}/install.sh" "dist/${PKG_NAME}/uninstall.sh" "dist/${PKG_NAME}/bin/llm-bridge"

          cd dist
          tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          rm -rf "${PKG_NAME}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.goarch }}
          path: dist/*.tar.gz
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build-linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all Linux build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release_artifacts
          sha256sum *.tar.gz > checksums.txt

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
