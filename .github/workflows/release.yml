name: Release Linux Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
          - goarch: arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Linux Binary and Package
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          PKG_NAME="llm-bridge-linux-${{ matrix.goarch }}"
          mkdir -p "dist/${PKG_NAME}/bin"
          mkdir -p "dist/${PKG_NAME}/scripts"

          go build -trimpath -ldflags="-s -w" -o "dist/${PKG_NAME}/bin/llm-bridge" ./cmd/llm-bridge
          cp scripts/install.sh "dist/${PKG_NAME}/"
          cp scripts/uninstall.sh "dist/${PKG_NAME}/"
          cp scripts/llm-bridge.service "dist/${PKG_NAME}/scripts/"
          chmod +x "dist/${PKG_NAME}/install.sh" "dist/${PKG_NAME}/uninstall.sh" "dist/${PKG_NAME}/bin/llm-bridge"

          cd dist
          tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          rm -rf "${PKG_NAME}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.goarch }}
          path: dist/*.tar.gz
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Download all Linux build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release_artifacts
          sha256sum *.tar.gz > checksums.txt

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
